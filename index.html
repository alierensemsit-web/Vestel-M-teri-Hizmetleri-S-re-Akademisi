.```html <!DOCTYPE html> <html lang="tr"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>VESTEL - OK mu NOK mu? Süreç Akademisi</title> <!-- Firebase SDK --> <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script> <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script> <style> :root { --vestel-red: #cc0000; --vestel-dark-red: #990000; --primary-blue: #004696; --success-color: #28a745; --error-color: #dc3545; --background-color: #f4f7f6; }
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: var(--background-color); color: #333; }
header { background-color: var(--vestel-red); padding: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); position: sticky; top: 0; z-index: 1000; border-bottom: 5px solid var(--vestel-dark-red); }
.header-left { display: flex; align-items: center; gap: 20px; }
.logo { font-size: 42px; font-weight: 900; color: white; letter-spacing: 3px; text-shadow: 3px 3px 6px rgba(0,0,0,0.4); line-height: 1; }
.badge-title { background-color: var(--primary-blue); color: white; padding: 8px 18px; border-radius: 30px; font-size: 16px; font-weight: bold; border: 2px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: inline-block; text-transform: uppercase; letter-spacing: 1px; }
.header-controls { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
#live-indicator { display: flex; align-items: center; font-size: 13px; background: rgba(0, 0, 0, 0.3); color: white; padding: 6px 14px; border-radius: 20px; font-weight: bold; border: 1px solid rgba(255, 255, 255, 0.3); }
.dot { height: 10px; width: 10px; background-color: #bbb; border-radius: 50%; display: inline-block; margin-right: 8px; }
.dot-live { background-color: #7FFF00; box-shadow: 0 0 10px #7FFF00; animation: pulse-green 1.5s infinite; }
@keyframes pulse-green { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(127, 255, 0, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(127, 255, 0, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(127, 255, 0, 0); } }
.header-buttons button { background-color: white; color: var(--vestel-red); border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; margin-left: 10px; transition: all 0.2s; box-shadow: 0 3px 8px rgba(0,0,0,0.2); font-size: 14px; }
.header-buttons button:hover { background-color: #f0f0f0; transform: translateY(-2px); box-shadow: 0 5px 12px rgba(0,0,0,0.3); }
.container { max-width: 600px; margin: 20px auto; padding: 25px; background: white; border-radius: 15px; box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
.screen { display: none; }
.active-screen { display: block; }
h2 { text-align: center; color: var(--vestel-red); margin-top: 0; font-size: 28px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
.form-group { margin-bottom: 20px; }
label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
input[type="text"], input[type="password"], textarea, select { width: 100%; padding: 14px; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; transition: border-color 0.2s; }
input[type="text"]:focus, input[type="password"]:focus, textarea:focus, select:focus { border-color: var(--vestel-red); outline: none; }
button.action-btn { width: 100%; background-color: var(--vestel-red); color: white; border: none; padding: 16px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.2s, transform 0.1s; box-shadow: 0 4px 10px rgba(204,0,0,0.3); }
button.action-btn:hover { background-color: var(--vestel-dark-red); }
button.action-btn:active { transform: scale(0.98); }
.question-number { font-size: 20px; font-weight: bold; color: var(--primary-blue); margin-bottom: 15px; background: #eef3f8; padding: 10px; border-radius: 5px; text-align: center; }
.question-text { font-size: 22px; margin-bottom: 25px; line-height: 1.5; font-weight: 500; text-align: center; min-height: 100px; display: flex; align-items: center; justify-content: center; }
.options-container { display: flex; gap: 20px; margin-top: 20px; }
.option-btn { flex: 1; padding: 25px; font-size: 28px; font-weight: 900; color: white; border: none; border-radius: 12px; cursor: pointer; transition: transform 0.1s, filter 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
.option-btn:hover { filter: brightness(1.1); }
.option-btn:active { transform: scale(0.95); }
.btn-ok { background-color: var(--success-color); } .btn-nok { background-color: var(--error-color); }
table { width: 100%; border-collapse: collapse; margin-top: 20px; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
th, td { padding: 14px; text-align: left; border-bottom: 1px solid #eee; }
th { background-color: var(--vestel-red); color: white; font-weight: bold; }
tr:nth-child(even) { background-color: #fafafa; }
tr:hover { background-color: #f1f1f1; }
.feedback { margin-top: 20px; padding: 20px; border-radius: 10px; line-height: 1.5; }
.feedback.correct { background-color: #d4edda; color: #155724; border: 2px solid #c3e6cb; }
.feedback.wrong { background-color: #f8d7da; color: #721c24; border: 2px solid #f5c6cb; }
.explanation { margin-top: 12px; font-weight: bold; padding-top: 10px; border-top: 1px solid rgba(0,0,0,0.1); }
.admin-question-card { border: 2px solid #ddd; padding: 20px; margin-bottom: 20px; border-radius: 10px; background-color: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
.admin-question-card textarea, .admin-question-card select { margin-bottom: 15px; }
.admin-question-card button { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; margin-right: 10px; }
.btn-save { background-color: var(--success-color); color: white; } .btn-delete { background-color: var(--error-color); color: white; } </style> </head> <body>
<header> <div class="header-left"> <div class="logo">VESTEL</div> <div class="badge-title">Süreç Akademisi</div> </div> <div class="header-controls"> <div id="live-indicator"> <span class="dot dot-live"></span> Canlı Bağlantı </div> <div class="header-buttons"> <button onclick="showScreen('leaderboard-screen')">Genel Sıralama</button> <button onclick="shareApp()">Paylaş</button> <button onclick="openAdminLogin()">⚙️ Yönetici</button> </div> </div> </header>
<div class="container"> <!-- Başlangıç Ekranı --> <div id="home-screen" class="screen active-screen"> <h2>Giriş Ekranı</h2> <div class="form-group"> <label for="username">Kullanıcı Adı:</label> <input type="text" id="username" placeholder="Adınızı ve Soyadınızı girin"> </div> <button class="action-btn" onclick="startTest()">TESTİ BAŞLAT</button> </div>
<!-- Soru Ekranı --> <div id="quiz-screen" class="screen"> <div class="question-number" id="question-number">Soru 1</div> <div class="question-text" id="question-text">Soru metni buraya gelecek.</div> <div class="options-container"> <button class="option-btn btn-ok" onclick="answerQuestion('OK')">OK</button> <button class="option-btn btn-nok" onclick="answerQuestion('NOK')">NOK</button> </div> </div>
<!-- Sonuç Ekranı --> <div id="result-screen" class="screen"> <h2>Test Sonucu</h2> <div id="score-summary" style="text-align: center; font-size: 20px; margin-bottom: 20px; font-weight: bold;"></div> <div id="detailed-feedback"></div> <button class="action-btn" onclick="resetApp()">Ana Menüye Dön</button> </div>
<!-- Genel Sıralama Ekranı --> <div id="leaderboard-screen" class="screen"> <h2>Genel Sıralama</h2> <div style="text-align: right; margin-bottom: 10px;"> <button onclick="loadLeaderboard()" style="padding: 8px 15px; border-radius: 15px; background: var(--primary-blue); color: white; border: none; font-weight: bold; cursor: pointer;">↻ Yenile</button> </div> <table> <thead> <tr> <th>Sıra</th> <th>Kullanıcı Adı</th> <th>Doğru</th> <th>Yanlış</th> <th>Süre</th> <th>Tarih</th> </tr> </thead> <tbody id="leaderboard-body"> <!-- Veriler buraya gelecek --> </tbody> </table> <button class="action-btn" onclick="showScreen('home-screen')">Ana Menüye Dön</button> </div>
<!-- Yönetici Giriş Ekranı --> <div id="admin-login-screen" class="screen"> <h2>Yönetici Girişi</h2> <div class="form-group"> <input type="password" id="admin-pass" placeholder="Yönetici Şifresi"> </div> <button class="action-btn" onclick="checkAdminLogin()">Giriş Yap</button> <button style="background:none; border:none; color: var(--primary-blue); text-decoration:underline; width:100%; margin-top:15px; cursor:pointer; font-weight: bold;" onclick="showScreen('home-screen')">İptal</button> </div>
<!-- Yönetici Paneli Ekranı --> <div id="admin-panel-screen" class="screen"> <h2>Soruları Düzenle</h2> <div id="admin-questions-list"></div> <button class="action-btn" style="background-color: var(--primary-blue);" onclick="addNewQuestion()">+ Yeni Soru Ekle</button> <div style="margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px;"> <h3>Şifre Değiştir</h3> <div class="form-group"> <input type="password" id="new-admin-pass" placeholder="Yeni Şifre"> </div> <button class="action-btn" style="background-color: var(--success-color);" onclick="changeAdminPassword()">Şifreyi Güncelle</button> </div> <button class="action-btn" style="background-color: #666; margin-top: 20px;" onclick="logoutAdmin()">Çıkış Yap</button> </div> </div>
<script> // Firebase Yapılandırması const firebaseConfig = { apiKey: "YOUR_API_KEY", authDomain: "YOUR_PROJECT_ID.firebaseapp.com", databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com", projectId: "YOUR_PROJECT_ID", storageBucket: "YOUR_PROJECT_ID.appspot.com", messagingSenderId: "YOUR_SENDER_ID", appId: "YOUR_APP_ID" };
if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); } const database = firebase.database();
const defaultQuestions = [ { id: 1, question: "Değişim isteği direkt olarak yönlendirebilir.", answer: "NOK", explanation: "Arıza kaydı açılarak değişim talebi kaydı oluşturulur." }, { id: 2, question: "Müşteri farklı telefon numarası verirse MBD yapmaya gerek yoktur.", answer: "NOK", explanation: "MBD (Müşteri Bilgi Doğrulama) mutlaka yapılmalıdır." } ];
let questions = []; let currentUser = ""; let currentQuestionIndex = 0; let score = { correct: 0, wrong: 0 }; let userAnswers = []; let startTime;
document.addEventListener("DOMContentLoaded", () => { initApp(); setupLiveListeners(); });
async function initApp() { const snapshot = await database.ref('questions').once('value'); if (!snapshot.exists()) { await database.ref('questions').set(defaultQuestions); questions = defaultQuestions; } else { questions = snapshot.val(); } }
function setupLiveListeners() { database.ref('scores').on('value', (snapshot) => { if (document.getElementById('leaderboard-screen').classList.contains('active-screen')) { loadLeaderboard(); } });
database.ref('questions').on('value', (snapshot) => { if (snapshot.exists()) { questions = snapshot.val(); } }); }
function showScreen(screenId) { document.querySelectorAll('.screen').forEach(screen => { screen.classList.remove('active-screen'); }); document.getElementById(screenId).classList.add('active-screen'); }
function startTest() { const usernameInput = document.getElementById('username'); if (!usernameInput.value.trim()) { alert('Lütfen kullanıcı adınızı giriniz.'); return; } currentUser = usernameInput.value.trim(); currentQuestionIndex = 0; score = { correct: 0, wrong: 0 }; userAnswers = []; startTime = new Date(); showScreen('quiz-screen'); showQuestion(); }
function showQuestion() { if (currentQuestionIndex < questions.length) { const q = questions[currentQuestionIndex]; document.getElementById('question-number').innerText = Soru ${currentQuestionIndex + 1} / ${questions.length}; document.getElementById('question-text').innerText = q.question; } else { finishTest(); } }
function answerQuestion(option) { const q = questions[currentQuestionIndex]; const isCorrect = option === q.answer; if (isCorrect) { score.correct++; } else { score.wrong++; } userAnswers.push({ question: q.question, userAnswer: option, correctAnswer: q.answer, explanation: q.explanation, isCorrect: isCorrect }); currentQuestionIndex++; showQuestion(); }
async function finishTest() { const endTime = new Date(); const durationSeconds = Math.round((endTime - startTime) / 1000); showScreen('result-screen');
const successRate = Math.round((score.correct / questions.length) * 100); document.getElementById('score-summary').innerHTML = Test Tamamlandı!<br> Doğru: ${score.correct} | Yanlış: ${score.wrong}<br> Başarı Oranı: %${successRate}<br> Süre: ${durationSeconds} saniye;
const feedbackContainer = document.getElementById('detailed-feedback'); feedbackContainer.innerHTML = '<h3>Cevap Analiziniz:</h3>';
userAnswers.forEach((item, index) => { const div = document.createElement('div'); div.className = feedback ${item.isCorrect ? 'correct' : 'wrong'}; div.innerHTML = <strong>Soru ${index + 1}:</strong> ${item.question}<br> Verdiğiniz Cevap: ${item.userAnswer} ${item.isCorrect ? '✅' : '❌'}<br> ${!item.isCorrect ?Doğru Cevap: ${item.correctAnswer} : ''} <div class="explanation">Açıklama: ${item.explanation}</div>; feedbackContainer.appendChild(div); });
const scoreData = { username: currentUser, correct: score.correct, wrong: score.wrong, duration: durationSeconds, date: new Date().toLocaleDateString('tr-TR') + ' ' + new Date().toLocaleTimeString('tr-TR', {hour: '2-digit', minute:'2-digit'}) }; await database.ref('scores').push(scoreData); }
function resetApp() { document.getElementById('username').value = ''; showScreen('home-screen'); }
async function loadLeaderboard() { const snapshot = await database.ref('scores').once('value'); const scoresList = []; if (snapshot.exists()) { snapshot.forEach((childSnapshot) => { scoresList.push(childSnapshot.val()); }); }
scoresList.sort((a, b) => { if (b.correct !== a.correct) { return b.correct - a.correct; } return a.duration - b.duration; });
const tbody = document.getElementById('leaderboard-body'); tbody.innerHTML = '';
scoresList.forEach((item, index) => { const row = <tr> <td>${index + 1}</td> <td>${item.username}</td> <td>${item.correct}</td> <td>${item.wrong}</td> <td>${item.duration} sn</td> <td>${item.date}</td> </tr>; tbody.innerHTML += row; }); showScreen('leaderboard-screen'); }
function openAdminLogin() { document.getElementById('admin-pass').value = ''; showScreen('admin-login-screen'); }
async function checkAdminLogin() { const enteredPass = document.getElementById('admin-pass').value; const snapshot = await database.ref('adminPassword').once('value'); const correctPass = snapshot.exists() ? snapshot.val() : "2026";
if (enteredPass === correctPass) { loadAdminQuestions(); showScreen('admin-panel-screen'); } else { alert('Hatalı Şifre!'); } }
async function loadAdminQuestions() { const snapshot = await database.ref('questions').once('value'); if (snapshot.exists()) { questions = snapshot.val(); } const container = document.getElementById('admin-questions-list'); container.innerHTML = '';
questions.forEach((q, index) => { const card = document.createElement('div'); card.className = 'admin-question-card'; card.innerHTML = <div class="question-number">Soru ${index + 1}</div> <textarea id="q-text-${index}" rows="3">${q.question}</textarea> <label>Doğru Cevap:</label> <select id="q-answer-${index}"> <option value="OK" ${q.answer === 'OK' ? 'selected' : ''}>OK</option> <option value="NOK" ${q.answer === 'NOK' ? 'selected' : ''}>NOK</option> </select> <label>Açıklama:</label> <textarea id="q-explanation-${index}" rows="3">${q.explanation}</textarea> <div> <button class="btn-save" onclick="saveQuestion(${index})">Kaydet</button> <button class="btn-delete" onclick="deleteQuestion(${index})">Sil</button> </div>; container.appendChild(card); }); }
function saveQuestion(index) { questions[index].question = document.getElementById(q-text-${index}).value; questions[index].answer = document.getElementById(q-answer-${index}).value; questions[index].explanation = document.getElementById(q-explanation-${index}).value; updateQuestionsDB(); }
function deleteQuestion(index) { questions.splice(index, 1); updateQuestionsDB(); loadAdminQuestions(); }
function addNewQuestion() { questions.push({ question: "Yeni Soru Metni", answer: "OK", explanation: "Soru Açıklaması" }); loadAdminQuestions(); }
async function updateQuestionsDB() { await database.ref('questions').set(questions); alert('Sorular güncellendi!'); }
async function changeAdminPassword() { const newPass = document.getElementById('new-admin-pass').value; if (!newPass) { alert('Lütfen yeni bir şifre girin.'); return; } await database.ref('adminPassword').set(newPass); alert('Yönetici şifresi güncellendi!'); document.getElementById('new-admin-pass').value = ''; }
function logoutAdmin() { showScreen('home-screen'); }
function shareApp() { if (navigator.share) { navigator.share({ title: 'Vestel - Süreç Akademisi', text: 'Süreç testini çözmek için tıkla:', url: window.location.href, }).catch(() => {}); } else { navigator.clipboard.writeText(window.location.href); alert('Uygulama linki panoya kopyalandı!'); } } </script>
</body> </html>
